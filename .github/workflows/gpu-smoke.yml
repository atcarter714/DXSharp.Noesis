name: D3D12 smoke (interactive runner)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, dxsharp-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./eng/build.ps1 -Smoke
